name: Build (Ubuntu)
# on:
#     push:
#         branches: [main]
#         tags-ignore:
#             - "**"
#     pull_request:
#     workflow_dispatch:
#     workflow_call:

on:
  workflow_dispatch:
  workflow_call:

jobs:
    build:
        name: Build wheel (linux_x86_64, Python ${{ matrix.python-version }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]
        env:
            PYTHON_VERSION: ${{ matrix.python-version }}

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Python build/CI tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install --upgrade build twine auditwheel patchelf

            - name: Install native dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential cmake pkg-config python3-dev libhidapi-dev

            - name: Build wheel
              run: python -m build --wheel --outdir wheelhouse-raw

            - name: Repair wheel (bundle shared libraries, manylinux tag)
              run: |
                  auditwheel show wheelhouse-raw/*.whl
                  auditwheel repair wheelhouse-raw/*.whl --wheel-dir dist

            - name: Check distributions
              run: python -m twine check dist/*

            - name: Smoke test wheel
              working-directory: ${{ runner.temp }}
              run: |
                  python -m venv smoke-venv
                  smoke-venv/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
                  smoke-venv/bin/python - <<'EOF'
                  import hidapi_py

                  print(hidapi_py.__file__)
                  print("version:", hidapi_py.__version__, "hidapi:", hidapi_py.__hid_version__)
                  assert "site-packages" in hidapi_py.__file__

                  hidapi_py.hid_init()
                  # Runners have no HID devices; this only checks that enumeration works at all.
                  print("devices:", len(hidapi_py.get_all_device_infos(0, 0)))
                  hidapi_py.hid_exit()
                  EOF
                  site="$(smoke-venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
                  ldd "$site"/hidapi_py/hidapi_py.*.so

            - uses: actions/upload-artifact@v7
              with:
                  name: dist-ubuntu-${{ matrix.python-version }}
                  path: dist/
                  if-no-files-found: error
