name: Build (Windows)
# on:
#     push:
#         branches: [main]
#         tags-ignore:
#             - "**"
#     pull_request:
#     workflow_dispatch:
#     workflow_call:

on:
  workflow_dispatch:
  workflow_call:

jobs:
    build:
        name: Build wheel (win_amd64, Python ${{ matrix.python-version }})
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]
        env:
            PYTHON_VERSION: ${{ matrix.python-version }}

        defaults:
            run:
                shell: powershell

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  architecture: "x64"

            - name: Install Python build/CI tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install --upgrade build twine

            # hidapi.dll comes prebuilt from deps/hidapi-win; CMake installs it into the package.
            - name: Build wheel
              run: python -m build --wheel

            # One sdist is enough; the other matrix entries would upload identical copies.
            - name: Build sdist
              if: matrix.python-version == '3.11'
              run: python -m build --sdist

            - name: Check distributions
              run: python -m twine check dist/*

            - name: Smoke test wheel
              working-directory: ${{ runner.temp }}
              run: |
                  python -m venv smoke-venv
                  $whl = (Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl").FullName
                  smoke-venv\Scripts\python -m pip install --no-deps "$whl"
                  @'
                  import hidapi_py

                  print(hidapi_py.__file__)
                  print("version:", hidapi_py.__version__, "hidapi:", hidapi_py.__hid_version__)
                  assert "site-packages" in hidapi_py.__file__

                  hidapi_py.hid_init()
                  # Runners have no HID devices; this only checks that enumeration works at all.
                  print("devices:", len(hidapi_py.get_all_device_infos(0, 0)))
                  hidapi_py.hid_exit()
                  '@ | smoke-venv\Scripts\python -

            - uses: actions/upload-artifact@v7
              with:
                  name: dist-windows-${{ matrix.python-version }}
                  path: dist/
                  if-no-files-found: error
