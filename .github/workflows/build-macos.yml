name: Build (macOS)
# on:
#     push:
#         branches: [main]
#         tags-ignore:
#             - "**"
#     pull_request:
#     workflow_dispatch:
#     workflow_call:

on:
  workflow_dispatch:
  workflow_call:

jobs:
    build:
        name: Build wheel (macosx_15_0_arm64, Python ${{ matrix.python-version }})
        runs-on: macos-15
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]
        env:
            PYTHON_VERSION: ${{ matrix.python-version }}
            MACOSX_DEPLOYMENT_TARGET: "15.0"

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Python build/CI tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install --upgrade build twine "delocate>=0.11"

            - name: Install native dependencies
              run: |
                  brew update
                  brew install cmake hidapi
                  echo "CMAKE_ARGS=-DHIDAPI_ROOT=$(brew --prefix hidapi)" >> "$GITHUB_ENV"

            - name: Build wheel
              env:
                  _PYTHON_HOST_PLATFORM: macosx-15.0-arm64
                  ARCHFLAGS: "-arch arm64"
              run: python -m build --wheel --outdir wheelhouse-raw

            - name: Repair wheel (bundle dylibs)
              run: |
                  delocate-listdeps wheelhouse-raw/*.whl
                  delocate-wheel --require-archs arm64 -w dist -v wheelhouse-raw/*.whl

            - name: Check distributions
              run: python -m twine check dist/*

            - name: Smoke test wheel
              working-directory: ${{ runner.temp }}
              timeout-minutes: 5
              run: |
                  python -m venv smoke-venv
                  smoke-venv/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl

                  site="$(smoke-venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
                  status=0
                  for f in "$site"/hidapi_py/hidapi_py.*.so "$site"/hidapi_py/.dylibs/*.dylib; do
                      if otool -L "$f" | tail -n +2 | grep -E '/opt/homebrew|/usr/local'; then
                          echo "::error::$f still links against Homebrew"
                          status=1
                      fi
                  done
                  [ "$status" -eq 0 ] || exit 1

                  smoke-venv/bin/python - <<'EOF'
                  import hidapi_py

                  print(hidapi_py.__file__)
                  print("version:", hidapi_py.__version__, "hidapi:", hidapi_py.__hid_version__)
                  assert "site-packages" in hidapi_py.__file__

                  hidapi_py.hid_init()
                  # Runners have no HID devices; this only checks that enumeration works at all.
                  print("devices:", len(hidapi_py.get_all_device_infos(0, 0)))
                  hidapi_py.hid_exit()
                  EOF

            - uses: actions/upload-artifact@v7
              with:
                  name: dist-macos-${{ matrix.python-version }}
                  path: dist/
                  if-no-files-found: error
